# fly.toml app configuration file generated for nairobi-powerbikes-pb on 2026-07-30T15:17:20+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nairobi-powerbikes-pb'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'pb_data'
  destination = '/pb_data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
